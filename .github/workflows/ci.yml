name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev python3-venv git wget curl google-cloud-cli


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10.18


      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up GCP credentials
        env:
          GCP_B64: ${{ secrets.GCP_CREDENTIALS_B64 }}
        run: |
          set -e
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-key.json" >> $GITHUB_ENV
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/gcp-key.json
          python3 -m json.tool gcp-key.json > /dev/null && echo "Valid JSON"
          gcloud auth activate-service-account --key-file=gcp-key.json
          gcloud config set project mlops-466312

      - name: Pull data and model from DVC
        run: |
          python -m venv .venv || true
          source .venv/bin/activate
          pip install dvc[gcs]
          dvc remote modify gcsremote credentialpath $(pwd)/gcp-key.json
          dvc pull -v

      - name: Run Sanity Test
        run: python sanity_check.py

      - name: Run Unit Tests
        run: pytest -v --junitxml=result.xml > result.log

      - name: Comment Test Report using CML
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Test Report" > report.md
          cat result.log >> report.md
          npx cml comment create report.md
