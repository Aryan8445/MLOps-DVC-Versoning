name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Install system dependencies (Ubuntu 24.04 compatible)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev python3-venv git wget curl

      # 3️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 4️⃣ Upgrade pip and install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary joblib pandas scikit-learn==1.7.2 dvc[gcs] pytest>=8.0,<9.0 cml

      # 5️⃣ Pull data and model from DVC
      - name: Pull data and model from DVC
        run: |
          dvc pull

      # 6️⃣ Run sanity check script
      - name: Run Sanity Test
        run: python sanity_check.py

      # 7️⃣ Run unit tests and save results
      - name: Run Unit Tests
        run: pytest -v --junitxml=result.xml > result.log

      # 8️⃣ Comment test report using CML
      - name: Comment Test Report using CML
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Test Report" > report.md
          cat result.log >> report.md
          npx cml comment create report.md
